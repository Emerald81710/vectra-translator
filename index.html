<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VECTRA Language Translator</title>
    <style>
        :root {
            --bg-color: #060a12;
            --card-bg: #090f1a;
            --accent: #10b981;
            --accent-dim: rgba(16, 185, 129, 0.2);
            --text: #94a3b8;
            --text-light: #e2e8f0;
            --border: #1e293b;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(18, 24, 38, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
            background-size: 100% 4px, 6px 100%;
            color: var(--text-light);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(16, 185, 129, 0.03);
            position: relative;
        }

        h1 {
            text-align: center;
            color: var(--accent);
            margin-top: 0;
            margin-bottom: 30px;
            letter-spacing: 4px;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px var(--accent-dim);
            animation: textGlow 4s infinite alternate;
        }

        @keyframes textGlow {
            0% { text-shadow: 0 0 8px rgba(16, 185, 129, 0.3); }
            100% { text-shadow: 0 0 18px rgba(16, 185, 129, 0.6); }
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 0 0 8px 4px;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #131e31;
            background-color: #04070d;
            color: var(--text-light);
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }

        textarea:focus {
            outline: none;
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.15), inset 0 2px 8px rgba(0,0,0,0.8);
            color: #fff;
        }

        textarea::placeholder {
            color: #334155;
        }

        .legend {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #1e293b;
            font-size: 11px;
            color: #475569;
            text-align: center;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>[ VECTRA TRANSLATOR ]</h1>
        
        <div class="input-group">
            <label for="englishInput">Plaintext (English & Numbers):</label>
            <textarea id="englishInput" placeholder="Type message here..."></textarea>
        </div>
        
        <div class="input-group">
            <label for="customInput">VECTRA Ciphertext:</label>
            <textarea id="customInput" placeholder="VECTRA Language will appear here..."></textarea>
        </div>
        
        <div class="legend">
            
    </div>

    <script>
        const translationMap = {
            'A': '^', 'B': '»', 'C': '⟪', 'D': '⟫', 'E': '¦', 'F': '⌈', 'G': '↺', 'H': 'µ', 
            'I': 'v', 'J': '⌉', 'K': '⤶', 'L': '⌊', 'M': '⊓', 'N': '⊔', 'O': '↻', 'P': '⌌', 
            'Q': '⌍', 'R': '⇄', 'S': '∼', 'T': '┬', 'U': '⋏', 'V': '⋎', 'W': '⌗', 'X': '⁕', 
            'Y': '⟰', 'Z': '↱', ' ': '·', '1': '⊢', '2': '⊣', '3': '⊤', '4': '⊥', '5': '⊹', 
            '6': '⊦', '7': '⊧', '8': '⫝', '9': '⫝̸', '0': '⊙'
        };

        const reverseMap = {};
        for (let key in translationMap) {
            if (translationMap[key] !== '') {
                reverseMap[translationMap[key]] = key;
            }
        }

        const englishInput = document.getElementById('englishInput');
        const customInput = document.getElementById('customInput');

        englishInput.addEventListener('input', () => {
            const text = englishInput.value.toUpperCase();
            let result = '';
            for (let char of text) {
                result += translationMap[char] !== undefined ? translationMap[char] : char;
            }
            customInput.value = result;
        });

        customInput.addEventListener('input', () => {
            const text = customInput.value;
            let result = '';
            for (let char of text) {
                result += reverseMap[char] !== undefined ? reverseMap[char] : char;
            }
            englishInput.value = result.toLowerCase();
        });
    </script>
</body>
</html>
